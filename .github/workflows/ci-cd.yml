name: CI/CD Pipeline

on:
  push:
    branches: [ 'main' ]  # Executa apenas na branch main
  pull_request:
    branches: [ 'main' ]  # Executa apenas em pull requests para a branch main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up JDK 1.8
        uses: actions/setup-java@v3
        with:
          distribution: 'adopt'
          java-version: '8'
          cache: maven

      - name: Build with Maven
        run: mvn clean install -Dmaven.test.skip=true

      - name: Build & push Docker image to Docker Hub
        uses: mr-smithers-excellent/docker-build-push@v5
        with:
          image: fabiocondo/kudondza-api
          tags: latest
          registry: docker.io
          dockerfile: Dockerfile
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Configure AWS CLI
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and tag Docker image for ECR
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/ku-dondza-repo:latest .

      - name: Push Docker image to ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/ku-dondza-repo:latest

      - name: Update ECS Service
        run: |
          # Registrar uma nova revisão da task definition
          aws ecs register-task-definition \
              --family ku-dondza-task \
              --network-mode awsvpc \
              --requires-compatibilities FARGATE \
              --cpu 256 \
              --memory 512 \
              --execution-role-arn arn:aws:iam::471112791344:role/ku-dondza-ecs-task-execution-role \
              --container-definitions '[{
                  "name": "ku-dondza-app",
                  "image": "${{ steps.login-ecr.outputs.registry }}/ku-dondza-repo:latest",
                  "memory": 512,
                  "cpu": 256,
                  "essential": true,
                  "portMappings": [
                      {
                          "containerPort": 8080,
                          "hostPort": 8080,
                          "protocol": "tcp"
                      }
                  ],
                  "logConfiguration": {
                      "logDriver": "awslogs",
                      "options": {
                          "awslogs-group": "/ecs/ku-dondza-app",
                          "awslogs-region": "us-east-1",
                          "awslogs-stream-prefix": "ecs"
                      }
                  }
              }]'

          # Atualizar o serviço no ECS para usar a nova revisão
          aws ecs update-service \
              --cluster ku-dondza-cluster \
              --service ku-dondza-service \
              --task-definition ku-dondza-task \
              --force-new-deployment