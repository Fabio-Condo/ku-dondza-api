version: "3.9"

networks:
  kudondza-network:
    driver: bridge

services:
  kudondza-mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: "root"
    ports:
      - "33066:3306"
    networks:
      - kudondza-network

  kudondza-api:
    #image: kudondza-api  # Usar imagem local
    image: fabiocondo/kudondza-api # Usar imagem do seu Docker Hub
    environment:
      DB_HOST: kudondza-mysql
      REDIS_HOST: kudondza-redis
      REDIS_PORT: 6379
    networks:
      - kudondza-network
    depends_on:
      - kudondza-mysql
      - kudondza-redis

  kudondza-proxy:
    build: ./nginx
    image: kudondza-proxy
    ports:
      - "80:80"
    networks:
      - kudondza-network
    depends_on:
      - kudondza-api

  kudondza-redis:
    image: redis:latest
    ports:
      - "6379:6379"
    networks:
      - kudondza-network



  # Se quiser usar a imagem que seta no docker hub
  # docker pull fabiocondo/kudondza-api
  # docker-compose up --scale kudondza-api=3

  # docker compose up -d --scale kudondza-api=3

  # Passo 1: Build da aplicacao  (3 comando que contem -Pdocker)
  # ./mvnw clean package
  # ./mvnw clean package -DskipTests
  # ./mvnw clean package -DskipTests -Pdocker

  # Remover os containers
  # docker compose down
  # docker compose down --volumes # Elimina junto com os volumes que guardam dados da BD

  # RESUMO DE COMANDOS POR EXECUTAR
  # ./mvnw clean package -DskipTests -Pdocker
  # docker-compose up --scale kudondza-api=3