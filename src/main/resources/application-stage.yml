spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}/e-learning?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Africa/Harare # Docker compose
    username: root
    password: root

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB        # Tamanho máximo por ficheiro
      max-request-size: 50MB      # Tamanho máximo total da requisição

server:
  tomcat:
    max-swallow-size: 50MB        # Tomcat: tamanho máximo para upload
    max-http-form-post-size: 50MB # Tomcat: tamanho máximo POST