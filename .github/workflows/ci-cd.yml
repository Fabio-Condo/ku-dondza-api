name: CI/CD Pipeline

on:
  push:
    branches: [ '**' ]  # Ajuste temporário para testar em todas as branches
  pull_request:
    branches: [ '**' ]  # Ajuste temporário para testar em todas as branches

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up JDK 1.8
        uses: actions/setup-java@v3
        with:
          distribution: 'adopt'
          java-version: '8'
          cache: maven

      - name: Build with Maven
        run: mvn clean install -Dmaven.test.skip=true

      - name: Upload JAR as artifact
        uses: actions/upload-artifact@v3
        with:
          name: target
          path: target/

      - name: Build & push Docker image to Docker Hub
        uses: mr-smithers-excellent/docker-build-push@v5
        with:
          image: fabiocondo/kudondza-api
          tags: latest
          registry: docker.io
          dockerfile: Dockerfile
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

  deploy:
    runs-on: ubuntu-latest
    needs: build  # Executa apenas após o job de build

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Download JAR artifact
        uses: actions/download-artifact@v3
        with:
          name: target
          path: target/

      - name: Configure AWS CLI
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and tag Docker image for ECR
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/ku-dondza-repo:latest .

      - name: Push Docker image to ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/ku-dondza-repo:latest

      - name: Terraform Apply
        run: |
          cd terraform
          terraform init
          terraform apply -auto-approve